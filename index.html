<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">

<title>Habeebiya Masjid Prayer Times</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="container">
  <h1>🕌 Habeebiya Masjid</h1>

  <div class="info-row">
    <div id="date"></div>
    <div id="clock"></div>
  </div>

  <div class="adhan-card">
    <div class="status-item">
      <span class="label">🔊 ADHAN</span>
      <strong id="headerAdhan">—</strong>
      <span id="headerAdhanTime">—</span>
    </div>

    <div class="divider"></div>

    <div class="status-item">
      <span class="label">◷ SALAH TIME</span>
      <strong id="headerSalahTime">—</strong>
    </div>
  </div>

  <div class="card">
    <table id="times"></table>
  </div>

  <div id="nextPrayer"></div>
</div>

<script src="app.js"></script>
<script>
if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('./service-worker.js')
      .catch(error => console.error('Service worker registration failed:', error));
  });
}
</script>
