<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Habeebiya Masjid Prayer Times</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="container">
  <h1>🕌 Habeebiya Masjid</h1>
  <div class="info-row">
    <div id="date"></div>
    <div id="clock"></div>
  </div>

  <div class="adhan-card">
    <div class="status-item">
      <span class="label">🔊 ADHAN</span>
      <strong id="headerAdhan">—</strong>
      <span id="headerAdhanTime">—</span>
    </div>
    <div class="divider"></div>
    <div class="status-item">
      <span class="label">◷ SALAH TIME</span>
      <strong id="headerSalahTime">—</strong>
    </div>
  </div>

  <div class="card">
    <table id="times"></table>
  </div>

  <div id="nextPrayer"></div>
</div>
<script src="app.js"></script>
</body>
</html>
